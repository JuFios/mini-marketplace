# Serves the built SPA and is the only entry point of the stack: /api and /uploads go to the API.

# Docker's embedded DNS. Resolving the API's name per request (see `set $api` below) keeps nginx
# working when the api container is recreated with a new address, and lets it start first.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Product images are limited to 2 MB by the API; the rest is multipart framing. Without this
  # nginx would refuse anything over its default 1 MB before the API could answer properly.
  client_max_body_size 3m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API counts requests per client address (rate limits). `$remote_addr` replaces whatever
    # the client sent, so a forged X-Forwarded-For cannot reach the API.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded product pictures: random file names that never change; the API marks them immutable.
  location /uploads/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Vite names these files after their content, so they can be cached for good.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Every other path is a route of the SPA: serve the shell and let the router decide. The shell
  # itself must always be revalidated, or a deployment would leave browsers on old asset names.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
