# Response headers of the single-page app (included by the locations that serve it). The API
# sets its own through helmet, so proxied locations do not include this file: a second policy
# on top of the API's would only ever make Swagger UI harder to load.
#
# script-src is 'self' only: the build emits no inline scripts. style-src allows inline styles
# because React `style` attributes and the toast library's injected stylesheet need them.
# img-src allows https: for product pictures that an administrator links from elsewhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
