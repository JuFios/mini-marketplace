name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  unit-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w api

  web:
    name: Web tests, build, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w web
      - run: npm run build -w web
      # Building Storybook catches a story that no longer compiles or renders.
      - run: npm run build-storybook -w web

  api-tests:
    name: API e2e tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: mini_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d mini_marketplace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Throwaway services of this job only; the test suite refuses any database whose name does
    # not end in `_test` and any Redis without a dedicated database index.
    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/mini_marketplace_test
      REDIS_URL: redis://localhost:6379/1
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin12345
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api
      # Running the seed twice proves it is idempotent: the second run would fail on any
      # duplicate it tried to insert.
      - name: Seed (twice)
        run: |
          npx prisma db seed
          npx prisma db seed
        working-directory: apps/api
      - run: npm run test:e2e -w api

  docker:
    name: Docker images and smoke test
    # Only worth the minutes once everything else is green.
    needs: [quality, unit-tests, web, api-tests]
    runs-on: ubuntu-latest
    env:
      # The mock payment provider approves every order at once, so the smoke test can insist on
      # a paid order instead of tolerating a random decline.
      PAYMENT_MOCK_FAILURE_RATE: '0'
      PAYMENT_MOCK_DELAY_MS: '0'
    steps:
      - uses: actions/checkout@v7
      # Only for the smoke script; the application itself runs in the containers.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build the images
        run: docker compose build
      # A fresh clone with no .env: this is exactly what a reader of the README does. `--wait`
      # returns once every service with a healthcheck is healthy and `migrate` has finished.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        # The ports are published on 127.0.0.1 only; naming it avoids depending on how `localhost` resolves.
        run: node scripts/smoke.mjs http://127.0.0.1:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
